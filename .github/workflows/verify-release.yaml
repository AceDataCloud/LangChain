name: Verify published release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version
        required: true
        default: "0.1.0"
      service:
        description: Optional independently versioned service (blank retains the grouped release)
        type: choice
        options: ["", "acemusic", "happyhorse", "gpt-image", "nano-banana", "suno", "seedance"]
        default: ""
      all_pypi:
        description: Verify all six on PyPI only after they exist
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pypi-install:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      SERVICE: ${{ inputs.service }}
      ALL_PYPI: ${{ inputs.all_pypi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public exact versions and import without API requests
        run: |
          if [ -n "$SERVICE" ]; then
            python scripts/verify_published.py --install pypi --version "$PACKAGE_VERSION" --service "$SERVICE"
          elif [ "$ALL_PYPI" = "true" ]; then
            python scripts/verify_published.py --install pypi --version "$PACKAGE_VERSION" --all-services
          else
            python scripts/verify_published.py --install pypi --version "$PACKAGE_VERSION"
          fi
  github-install:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all six official release wheels without API requests
        run: |
          if [ -n "$SERVICE" ]; then
            python scripts/verify_published.py --install github --version "$PACKAGE_VERSION" --service "$SERVICE"
          else
            python scripts/verify_published.py --install github --version "$PACKAGE_VERSION" --all-services
          fi
