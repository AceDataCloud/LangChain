name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all source packages
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e packages/core
          python -m pip install --no-deps -e packages/suno -e packages/seedance -e packages/happyhorse -e packages/gpt-image -e packages/nano-banana
      - run: python scripts/check_packages.py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/build_packages.py
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python-version }}
          path: dist/*
  registry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public candidate packages from PyPI
        run: python -m pip install 'langchain-acedatacloud==0.1.0rc1' 'langchain-happyhorse-acedatacloud==0.1.0rc1' 'langchain-gpt-image-acedatacloud==0.1.0rc1' 'langchain-nano-banana-acedatacloud==0.1.0rc1'
      - run: python scripts/verify_published.py
