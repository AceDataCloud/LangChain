[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-seedance-acedatacloud"
version = "0.1.0"
description = "Seedance by Ace Data Cloud LangChain toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name="Ace Data Cloud Dev", email="dev@acedata.cloud"}]
keywords = ["seedance", "video", "langchain", "acedatacloud"]
dependencies = ["langchain-acedatacloud==0.1.0"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/AceDataCloud/LangChain"
Source = "https://github.com/AceDataCloud/LangChain"
Issues = "https://github.com/AceDataCloud/LangChain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_seedance_acedatacloud"]
