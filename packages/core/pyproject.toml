[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-acedatacloud"
version = "0.1.0"
description = "Ace Data Cloud chat model and shared LangChain service runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name="Ace Data Cloud Dev", email="dev@acedata.cloud"}]
keywords = ["acedatacloud", "langchain", "chat", "provider"]
dependencies = ["langchain-openai>=1.7,<2", "httpx>=0.27,<1"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/AceDataCloud/LangChain"
Source = "https://github.com/AceDataCloud/LangChain"
Issues = "https://github.com/AceDataCloud/LangChain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_acedatacloud"]
